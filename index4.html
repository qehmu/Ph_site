<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A_studio_design</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background: #ffffff;
            color: #111;
            padding: 24px;
            box-sizing: border-box;
        }

        .slide-container {
            max-width: 820px;
            width: 100%;
            text-align: center;
        }

        .slide-up {
            transform: translateY(500px);
            opacity: 0;
            animation: slideUp 0.9s cubic-bezier(.22, .9, .35, 1) forwards;
        }

        .slide-up.delay-1 {
            animation-delay: 0.1s;
        }

        .slide-up.delay-2 {
            animation-delay: 1.1s;
        }

        .slide-up.delay-3 {
            animation-delay: 2.1s;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .slide-up {
                animation: none;
                transform: none;
                opacity: 1;
            }
        }

        .slide-up.delay-1 {
            font-size: 30px;
        }

        .slide-up.delay-2 {
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="slide-container">
        <h3 class="slide-up delay-1">Привет, я собственноручно сделал этот сайт. Вы будете перенаправлены назад через 10
            секунд. Спасибо.</h3>
        <p class="slide-up delay-2">Можно заказать разработку вашего сайта, если этот вам понравился. Напишите мне,
            обсудим. Контакты все те же.</p>
        <p class="slide-up delay-3">
            <a href="https://t.me/dabelk_ph" ,
                style="font-size: 28px;text-decoration: none;text-align: center; color: rgb(163, 140, 117);">Телеграм</a><br>
            <a href="tel:+79537560000" ,
                style="font-size: 28px;text-decoration: none;text-align: center;color: rgb(163, 140, 117);">+7‑953‑756‑0000</a>
        </p>
    </div>
    <script>
        setTimeout(function () {
            window.location.href = "index.html";
        }, 10000);
    </script>
</body>

</html>
